services:
  # HeliosDB-Nano 4.41.0 (official release, db/nano/): AES-256-GCM at rest, TLS with the
  # X25519MLKEM768 post-quantum hybrid key exchange, SCRAM-SHA-256, durable commits, HTTP/MCP
  # listener off. Password + encryption key: /etc/heliosdb-telemetry/db.env (root, 0600) as a compose
  # secret; losing the key loses the store (private operations runbook).
  # The store was CREATED by 4.41.0 (marker /data/.heliosdb-store) and the image refuses a data
  # directory it did not create. The legacy 3.x volume telemetry_telemetry_heliosdb is the rollback
  # copy and is deliberately NOT declared here (so `docker compose down -v` cannot delete it); never
  # point a 4.x engine at it (docs/NANO-4.41-MIGRATION.md).
  # The receiver workload is small and uses only basic SQL; it runs CREATE TABLE IF NOT EXISTS
  # itself on first connect.
  heliosdb:
    build:
      context: ./db/nano
    image: telemetry-heliosdb:4.41.0
    container_name: telemetry-heliosdb
    restart: unless-stopped
    environment:
      TLS_CN: telemetry-heliosdb
    secrets:
      - source: telemetry_db
        target: db.env
    volumes:
      - telemetry_heliosdb_441:/data
      - telemetry_heliosdb_tls:/tls
      - telemetry_heliosdb_tlspub:/tls-pub
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "openssl s_client -starttls postgres -connect 127.0.0.1:5432 -brief </dev/null 2>&1 | grep -q 'CONNECTION ESTABLISHED'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  receiver:
    # Build from a clean checkout (git worktree), not from a working tree with uncommitted edits.
    build: ./receiver
    image: telemetry-receiver:4.41-pqc
    container_name: telemetry-receiver
    restart: unless-stopped
    environment:
      PORT: "4080"
      # Nano serves a single database named `heliosdb`; SCRAM works for the bootstrap role `postgres`
      # only (HeliosDB-Nano #49). No password in the URL: the entrypoint exports PGPASSWORD from the
      # secret. verify-full pins the self-signed server certificate and checks the host name.
      PG_URL: postgresql://postgres@telemetry-heliosdb:5432/heliosdb?sslmode=verify-full&sslrootcert=/tls-pub/server.crt
      SALT_FILE: /run/telemetry/salt
    secrets:
      - source: telemetry_db
        target: db.env
    volumes:
      - telemetry_salt:/run/telemetry
      - telemetry_heliosdb_tlspub:/tls-pub:ro
    depends_on:
      heliosdb:
        condition: service_healthy
    networks:
      - db
      - management-network

secrets:
  telemetry_db:
    file: /etc/heliosdb-telemetry/db.env

volumes:
  telemetry_heliosdb_441:
  telemetry_heliosdb_tls:
  telemetry_heliosdb_tlspub:
  telemetry_salt:

networks:
  # Database traffic only. Pinned: Docker's default address pools are exhausted on this host.
  db:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.250.20.0/24
  management-network:
    external: true
